<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>普通生图 · preview（studio-host DOM 镜像）</title>
<style>
  /* Preview approximates host tokens; live host inherits body[data-ds-dark-theme] */
  :root {
    --dsw-alias-bg-base: #fff;
    --dsw-alias-bg-layer-1: #fff;
    --dsw-alias-bg-module-platform: #f5f6f7;
    --dsw-specific-sidebar-fill: #f5f6f7;
    --dsw-specific-input-major: #fff;
    --dsw-alias-label-primary: #0f1115;
    --dsw-alias-label-secondary: #61666b;
    --dsw-alias-label-tertiary: #81858c;
    --dsw-alias-border-l1: rgba(0,0,0,.06);
    --dsw-alias-border-l2: rgba(0,0,0,.1);
    --dsw-alias-border-l4: rgba(0,0,0,.18);
    --dsw-alias-button-primary-fill: #0f1115;
    --dsw-alias-label-primary-foreground: #fff;
    --dsw-alias-interactive-bg-active: rgba(0,0,0,.06);
    --dsw-alias-state-business-primary: #4176e6;
    --dsh-content-font-size: 13px;
  }
  body { margin:0; font: var(--dsh-content-font-size)/1.4 system-ui,sans-serif; background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary); }
  [data-dsh-ws-studio-host] { display:flex; flex-direction:column; height:100vh; background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary); border-color: var(--dsw-alias-border-l2); }
  [data-ws-cols] { display:flex; flex:1; min-height:0; }
  [data-ws-col="history"] { width:264px; border-right:1px solid var(--dsw-alias-border-l2); padding:8px; overflow:auto; background: var(--dsw-specific-sidebar-fill); }
  [data-ws-col="studio"] { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:flex-start; overflow:auto; background: var(--dsw-alias-bg-base); }
  /* Right column = result landing */
  [data-ws-inspire-wall] [data-ws-stage] { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:8px; padding:0; overflow:hidden; background:transparent; border:0; }
  [data-ws-stage-head] { display:flex; align-items:baseline; gap:8px; }
  [data-ws-stage-head] strong { font-size:13px; font-weight:650; color: var(--dsw-alias-label-primary); }
  [data-ws-stage-empty] { flex:1; min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:28px 16px; text-align:center; border:0; border-radius:10px; background: var(--dsw-alias-bg-module-platform); }
  [data-ws-stage-empty][hidden],
  [data-ws-stage][data-has-results] [data-ws-stage-empty],
  [data-ws-stage][data-busy] [data-ws-stage-empty] { display:none !important; }
  [data-ws-stage-empty-hint] { font-size:12px; color: var(--dsw-alias-label-tertiary); }
  [data-ws-results] { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; flex:1; min-height:0; overflow:auto; }
  [data-ws-results][hidden] { display:none !important; }
  [data-ws-result-card] { border:1px solid var(--dsw-alias-border-l2); border-radius:10px; padding:4px; background: var(--dsw-alias-bg-module-platform); overflow:hidden; }
  [data-ws-dock] { flex:0 0 auto; padding:8px 12px 0; display:flex; flex-direction:column; gap:4px; overflow:auto; min-height:0; }
  [data-ws-inspire-wall] { width:318px; border-left:1px solid var(--dsw-alias-border-l2); padding:8px; background: var(--dsw-alias-bg-base); display:flex; flex-direction:column; gap:8px; overflow:hidden; min-height:0; }
  [data-ws-pane-drag] { width:5px; cursor:col-resize; background:transparent; }
  [data-ws-ref-slot] { display:none; padding:8px; border:1px dashed var(--dsw-alias-border-l2); margin:0; border-radius:10px; background: var(--dsw-alias-bg-module-platform); }
  [data-ws-ref-slot][data-visible] { display:block; }
  [data-ws-progress], [data-ws-fail], [data-ws-result-actions], [data-ws-plan-panel] { display:none; margin:0; padding:8px; border-radius:10px; border:1px solid var(--dsw-alias-border-l2); background: var(--dsw-alias-bg-module-platform); }
  [data-ws-progress][data-visible], [data-ws-fail][data-visible], [data-ws-result-actions][data-visible], [data-ws-plan-panel][data-visible] { display:block; }
  [data-ws-conn-status] { padding:0 8px; height:22px; border:1px solid var(--dsw-alias-border-l2); border-radius:999px; display:inline-flex; align-items:center; background: var(--dsw-alias-bg-module-platform); color: var(--dsw-alias-label-secondary); font-size:11px; }
  [data-ws-cta] { width:100%; min-height:40px; border:0; border-radius:9px; background: var(--dsw-alias-button-primary-fill); color: var(--dsw-alias-label-primary-foreground); font-weight:700; cursor:pointer; }
  [data-ws-cta-footer] { flex:0 0 auto; margin-top:0; padding:6px 12px 10px; border-top:1px solid var(--dsw-alias-border-l2); background: var(--dsw-alias-bg-base); }
  [data-ws-status] { opacity:.65; font-size:11.5px; margin:4px 0 0; min-height:0; }
  [data-ws-status]:empty { display:none; }
  header[data-ws-top-bar] { display:flex; gap:4px; padding:2px 8px; border-bottom:1px solid var(--dsw-alias-border-l1); align-items:center; background: var(--dsw-alias-bg-base); }
  [data-ws-top-seg] { display:inline-flex; gap:0; padding:1px; border-radius:6px; background: var(--dsw-alias-bg-module-platform); border:1px solid var(--dsw-alias-border-l1); }
  [data-ws-top-seg] button { padding:1px 6px; border:0; border-radius:4px; background:transparent; color: var(--dsw-alias-label-tertiary); font:inherit; font-size:10.5px; font-weight:400; cursor:pointer; }
  [data-ws-top-seg] button[aria-current="true"] { background: var(--dsw-alias-interactive-bg-active); color: var(--dsw-alias-label-primary); font-weight:500; }
  button { font:inherit; cursor:pointer; }
  .note { color: var(--dsw-alias-label-tertiary); font-size:11px; padding:8px 12px; }
</style>
</head>
<body>
<!-- Mirror of key DOM from src/client/studio-host.js — not a live host -->
<div data-dsh-ws-studio-host role="main" aria-label="生图">
  <header data-ws-top-bar>
    <div data-ws-top-seg role="tablist" aria-label="工作台模式">
      <button type="button" data-ws-top="普通生图" aria-current="true" data-active>普通生图</button>
      <button type="button" data-ws-top="视频生成" aria-current="false">视频生成</button>
      <button type="button" data-ws-top="无限画布" aria-current="false">无限画布</button>
      <button type="button" data-ws-top="画廊" aria-current="false">画廊</button>
      <button type="button" data-ws-top="电商模式" aria-current="false">电商模式</button>
    </div>
    <span style="flex:1"></span>
    <span data-ws-conn-status title="已连接">已连接</span>
    <button type="button" data-ws-chat-toggle>AI 对话</button>
  </header>
  <div data-ws-cols>
    <aside data-ws-col="history">
      <div>历史记录</div>
      <div data-ws-history-list>
        <div data-ws-history-empty>暂无记录</div>
      </div>
      <button type="button" data-ws-history-clear>清空</button>
    </aside>
    <div data-ws-pane-drag="history"></div>
    <section data-ws-col="studio">
      <div data-ws-dock>
        <div role="tablist">
          <button type="button" data-ws-mode="文生图" aria-pressed="true">文生图</button>
          <button type="button" data-ws-mode="图生图" aria-pressed="false">图生图</button>
        </div>
        <div data-ws-ref-slot aria-label="参考图">
          <button type="button" data-ws-ref-upload>上传</button>
          <input type="file" data-ws-ref-file accept="image/*" multiple hidden />
          <div data-ws-ref-drop>点击、拖入或 Ctrl+V 粘贴</div>
          <div data-ws-ref-thumbs></div>
        </div>
        <label>提示词 <button type="button">模板库</button> <button type="button">提示词增强</button></label>
        <textarea rows="2" placeholder="描述你想生成的画面" data-ws-prompt style="width:100%;min-height:56px;"></textarea>
        <div>比例 / 清晰度 / 张数 / 细节 / 模型（chips）</div>
        <div data-ws-plan-panel>
          <textarea rows="2" placeholder="LLM 未接 — 可手写方案后点「就这样出图」"></textarea>
        </div>
      </div>
      <div data-ws-cta-footer>
        <button type="button" data-ws-cta>开始生成</button>
        <p data-ws-status class="note" style="padding:0;"></p>
      </div>
    </section>
    <div data-ws-pane-drag="chat"></div>
    <aside data-ws-inspire-wall>
      <div data-ws-stage aria-label="生成结果">
        <div data-ws-stage-head><strong>生成结果</strong></div>
        <div data-ws-stage-empty>
          <span data-ws-stage-empty-hint>生成后显示在这里</span>
        </div>
        <div data-ws-progress>
          <div data-ws-progress-meta>
            <span data-ws-progress-label>等待宿主进度</span>
            <span data-ws-progress-elapsed>耗时 0s</span>
            <button type="button" data-ws-cancel>取消</button>
          </div>
          <div data-ws-progress-bar><i style="display:block;height:6px;width:36%;background:var(--dsw-alias-state-business-primary, #4176e6);"></i></div>
        </div>
        <div data-ws-fail><div data-ws-fail-reason>原因：示例失败</div><button type="button" data-ws-retry>重试</button></div>
        <div data-ws-results hidden></div>
        <div data-ws-result-actions>
          <button type="button" data-ws-result-action="下载">下载</button>
          <button type="button" data-ws-result-action="加画廊">加画廊</button>
          <button type="button" data-ws-result-action="加对话">加对话</button>
          <button type="button" data-ws-result-action="当参考图">当参考图</button>
          <button type="button" data-ws-result-action="重新生成">重新生成</button>
          <button type="button" data-ws-result-action="复制提示词">复制提示词</button>
          <button type="button" data-ws-result-action="拿去做视频">拿去做视频</button>
        </div>
      </div>
    </aside>
  </div>
</div>
</body>
</html>
